<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240">
  <rect x="1" y="1" width="798" height="238" rx="16" fill="#f7f2ea" stroke="#111111" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif"
        font-size="11" font-weight="600" letter-spacing="3"
        fill="#111111" opacity="0.5">HOW RICE IS CALCULATED</text>

  <!-- REACH -->
  <rect x="60" y="50" width="118" height="52" rx="8" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="119" y="82" text-anchor="middle"
        font-family="Impact, Arial Narrow, sans-serif" font-size="20" fill="#111111" letter-spacing="1">REACH</text>

  <!-- × -->
  <text x="193" y="82" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="20" fill="#111111" opacity="0.3">×</text>

  <!-- IMPACT -->
  <rect x="208" y="50" width="118" height="52" rx="8" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="267" y="82" text-anchor="middle"
        font-family="Impact, Arial Narrow, sans-serif" font-size="20" fill="#111111" letter-spacing="1">IMPACT</text>

  <!-- × -->
  <text x="341" y="82" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="20" fill="#111111" opacity="0.3">×</text>

  <!-- CONFIDENCE -->
  <rect x="356" y="50" width="152" height="52" rx="8" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="432" y="82" text-anchor="middle"
        font-family="Impact, Arial Narrow, sans-serif" font-size="20" fill="#111111" letter-spacing="1">CONFIDENCE</text>

  <!-- Fraction line -->
  <line x1="60" y1="114" x2="508" y2="114" stroke="#111111" stroke-width="2"/>

  <!-- EFFORT (centered under fraction line, center=284) -->
  <rect x="225" y="126" width="118" height="52" rx="8" fill="#111111"/>
  <text x="284" y="158" text-anchor="middle"
        font-family="Impact, Arial Narrow, sans-serif" font-size="20" fill="#f7f2ea" letter-spacing="1">EFFORT</text>

  <!-- = -->
  <text x="534" y="124" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="28" fill="#111111" opacity="0.35">=</text>

  <!-- RICE SCORE box -->
  <rect x="558" y="50" width="182" height="128" rx="12" fill="#ec5a8f"/>
  <text x="649" y="106" text-anchor="middle"
        font-family="Impact, Arial Narrow, sans-serif" font-size="38" fill="#ffffff" letter-spacing="2">RICE</text>
  <text x="649" y="150" text-anchor="middle"
        font-family="Impact, Arial Narrow, sans-serif" font-size="38" fill="#ffffff" letter-spacing="2">SCORE</text>
</svg>
