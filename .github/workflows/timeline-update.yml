name: Daily AI Timeline Update

on:
  schedule:
    - cron: '0 8 * * *'  # 8am UTC every day
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and merge timeline entries
        run: npm run timeline:update

      - name: Commit and push (triggers Vercel redeploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/timeline-entries.json data/timeline-fetched.json
          if git diff --staged --quiet; then
            echo "No new entries — skipping commit."
          else
            git commit -m "chore: update AI timeline [$(date -u '+%Y-%m-%d')]"
            git push
          fi
