name: Daily AI Timeline Fetch

on:
  schedule:
    - cron: '0 8 * * *'  # 8am UTC every day
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch pending entries
        run: node scripts/timeline-fetch.js

      - name: Check for new entries
        id: check
        run: |
          COUNT=$(node -e "
            const pending  = require('./data/timeline-pending.json');
            const existing = require('./data/timeline-entries.json');
            const existingUrls = new Set(existing.map(e => e.url || e.id));
            const newOnes = pending.filter(e => !existingUrls.has(e.url || e.id));
            console.log(newOnes.length);
          ")
          echo "new_count=$COUNT" >> $GITHUB_OUTPUT

      - name: Open review PR
        if: steps.check.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="timeline/pending-$(date -u '+%Y-%m-%d')"
          COUNT=${{ steps.check.outputs.new_count }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
          git add data/timeline-pending.json
          git commit -m "chore: timeline pending entries [$(date -u '+%Y-%m-%d')]" || true
          git push origin "$BRANCH"

          TITLES=$(node -e "
            const pending  = require('./data/timeline-pending.json');
            const existing = require('./data/timeline-entries.json');
            const existingUrls = new Set(existing.map(e => e.url || e.id));
            pending.filter(e => !existingUrls.has(e.url || e.id))
                   .forEach(e => console.log('- ' + e.title));
          ")

          gh pr create \
            --title "Timeline: $COUNT new entries for review [$(date -u '+%Y-%m-%d')]" \
            --body "$(cat <<EOF
          **$COUNT new entries** fetched from RSS feeds.

          Review \`data/timeline-pending.json\` and delete any entries that don't belong, then merge.
          Merging will automatically rebuild the timeline and trigger a Vercel redeploy.

          **Pending entries:**
          $TITLES
          EOF
          )" \
            --base main \
            --head "$BRANCH" || echo "PR may already exist for this branch"

      - name: No new entries
        if: steps.check.outputs.new_count == '0'
        run: echo "No new significant entries found."
